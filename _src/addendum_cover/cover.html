<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url(../../assets/fonts/inter-var.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;font-family:Inter,-apple-system,sans-serif;color:#111}
.cv{position:relative;width:1440px;height:900px;overflow:hidden;
  background:radial-gradient(60% 70% at 38% 52%,#ffffff 0%,#f3f4f6 55%,#e9ebee 100%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(17,17,17,.09) 1px,transparent 1.2px);background-size:22px 22px;
  -webkit-mask-image:radial-gradient(70% 70% at 50% 50%,#000 30%,transparent 85%)}
.brand{position:absolute;left:64px;top:56px;display:flex;align-items:center;gap:12px;z-index:9}
.brand img{width:34px;height:34px;border-radius:9px}
.brand b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.brand span{display:block;font-size:12px;color:rgba(0,0,0,.45);font-weight:400;margin-top:1px}
.tagline{position:absolute;left:64px;bottom:58px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:rgba(0,0,0,.4);z-index:9}

/* laptop */
.lap{position:absolute;left:110px;top:170px;width:900px;z-index:2}
.lid{background:#1b1c1f;border-radius:22px 22px 6px 6px;padding:14px 14px 22px;box-shadow:0 0 0 1.5px #3a3b3f inset,0 50px 90px -30px rgba(20,24,33,.45)}
.lid .scr{border-radius:6px;overflow:hidden;aspect-ratio:16/10;background:#fff}
.lid .scr img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.lid::before{content:'';position:absolute;left:50%;top:5px;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#2c2d31}
.base{position:relative;height:18px;margin:0 -62px;background:linear-gradient(#d7d9de,#b9bcc3 60%,#9ea2aa);border-radius:2px 2px 18px 18px;box-shadow:0 22px 30px -14px rgba(20,24,33,.45)}
.base::before{content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);width:150px;height:7px;background:#a9adb5;border-radius:0 0 8px 8px}

/* floating board */
.card{position:absolute;background:#fff;border-radius:16px;box-shadow:0 0 0 1px rgba(17,17,17,.06),0 30px 60px -24px rgba(20,24,33,.35),0 8px 18px -10px rgba(20,24,33,.18);overflow:hidden}
.kpi{left:700px;top:118px;width:460px;height:78px;padding:10px 12px;z-index:5}
.kpi .strip{width:100%;height:100%;background:url(../../assets/projects/addendum/02_stats.png) left center/1080px auto no-repeat;}
.queue{left:1060px;top:250px;width:240px;height:470px;z-index:4}
.queue img{width:100%;display:block}
.doc{left:1210px;top:330px;width:250px;height:400px;z-index:3;transform:rotate(5deg);border-radius:8px}
.doc img{width:100%;display:block}
.doc::after{content:'';position:absolute;inset:auto 0 0 0;height:120px;background:linear-gradient(transparent,#fff)}
.menu{left:520px;top:640px;width:420px;height:200px;z-index:6}
.menu .im{width:100%;height:100%;background:url(../../assets/projects/addendum/03_projects_menu.png) 0 0/720px auto no-repeat}
.lab{position:absolute;z-index:8;display:flex;align-items:center;gap:8px;background:#111;color:#fff;font-size:12.5px;font-weight:500;padding:8px 13px 8px 10px;border-radius:99px;box-shadow:0 12px 24px -10px rgba(0,0,0,.4)}
.lab i{width:8px;height:8px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 3px rgba(47,191,113,.25)}
.lab.r i{background:#e5484d;box-shadow:0 0 0 3px rgba(229,72,77,.25)}
.lab.w{background:#fff;color:#111;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 12px 24px -12px rgba(0,0,0,.35)}
.lab.w i{background:#111;box-shadow:none;border-radius:2px}
</style></head><body>
<div class="cv">
  <div class="dots"></div>
  <div class="brand"><img src="reelshort-icon.png" alt=""><div><b>Addendum Studio</b></div></div>

  <div class="lap"><div class="lid"><div class="scr"><img src="../../assets/projects/addendum/01_workspace.png" alt=""></div></div><div class="base"></div></div>

  <div class="card kpi"><div class="strip"></div></div>
  <div class="card queue"><img src="../../assets/projects/addendum/04_queue.png" alt=""></div>
  <div class="card doc"><img src="../../assets/projects/addendum/10_document_texas.png" alt=""></div>

  <div class="lab" style="left:1000px;top:222px"><i></i>Approval locked</div>
  <div class="lab r" style="left:1040px;top:738px"><i></i>Needs fix · inline validation</div>
  <div class="lab w" style="left:1262px;top:792px"><i></i>Batch export · PDF</div>

</div>
</body></html>
